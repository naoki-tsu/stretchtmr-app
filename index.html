<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ストレッチタイマー</title>
  <style>
    :root {
      --bg-color: #f4f6f8;
      --card-bg: #ffffff;
      --primary: #4a90e2;
      --work-color: #2e7d32;
      --rest-color: #ed6c02;
      --text-color: #333333;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    .container {
      background: var(--card-bg);
      width: 100%;
      max-width: 400px;
      padding: 24px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      text-align: center;
    }

    h1 {
      font-size: 1.25rem;
      color: #666;
      margin-bottom: 12px;
    }

    .status-badge {
      display: inline-block;
      padding: 6px 16px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 1.1rem;
      margin-bottom: 12px;
      background-color: #e0e0e0;
      color: #555;
    }

    .status-work {
      background-color: #e8f5e9;
      color: var(--work-color);
    }

    .status-rest {
      background-color: #fff3e0;
      color: var(--rest-color);
    }

    .timer-display {
      font-size: 4.5rem;
      font-weight: 800;
      font-family: monospace;
      margin: 8px 0;
      letter-spacing: -2px;
    }

    .set-info {
      font-size: 1.1rem;
      font-weight: 600;
      color: #555;
      margin-bottom: 24px;
    }

    .settings {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 24px;
      background: #f8f9fa;
      padding: 12px;
      border-radius: 12px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .input-group label {
      font-size: 0.75rem;
      color: #666;
      margin-bottom: 4px;
    }

    .input-group input {
      width: 100%;
      text-align: center;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
    }

    .controls {
      display: flex;
      gap: 10px;
    }

    .btn {
      flex: 1;
      padding: 14px 0;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-start {
      background-color: var(--primary);
      color: white;
    }

    .btn-stop {
      background-color: #d32f2f;
      color: white;
    }

    .btn-clear {
      background-color: #757575;
      color: white;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>ストレッチタイマー</h1>
    
    <div id="statusBadge" class="status-badge">準備中</div>
    <div id="timerDisplay" class="timer-display">00:30</div>
    <div id="setInfo" class="set-info">残数: 3 / 3 セット</div>

    <!-- 設定パネル -->
    <div class="settings">
      <div class="input-group">
        <label for="workInput">ストレッチ(秒)</label>
        <input type="number" id="workInput" value="30" min="1">
      </div>
      <div class="input-group">
        <label for="restInput">休憩(秒)</label>
        <input type="number" id="restInput" value="30" min="1">
      </div>
      <div class="input-group">
        <label for="setsInput">セット数</label>
        <input type="number" id="setsInput" value="3" min="1">
      </div>
    </div>

    <!-- 操作ボタン -->
    <div class="controls">
      <button id="startBtn" class="btn btn-start">スタート</button>
      <button id="stopBtn" class="btn btn-stop" disabled>ストップ</button>
      <button id="clearBtn" class="btn btn-clear">リセット</button>
    </div>
  </div>

  <script>
    // Web Audio API を使用した効果音作成（外部ファイル不要）
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }

    // 聞き取りやすく短いビープ音を再生
    function playBeep(freq = 880, type = 'sine', duration = 0.15) {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = type; // sine, square, triangle, sawtooth
      osc.frequency.value = freq; // 周波数（高さ）

      // アタックとリリースで破裂音を緩和しつつ通る音にする
      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    // 音通知パターン
    function soundNotice(type) {
      if (!audioCtx) return;
      if (type === 'countdown') {
        // カウントダウン（ピッ：高めのピッチ）
        playBeep(880, 'sine', 0.1);
      } else if (type === 'change') {
        // 切り替え（ピー！：高めで目立つ音）
        playBeep(1200, 'triangle', 0.25);
      } else if (type === 'complete') {
        // 全セット完了（ピピピーン！）
        playBeep(523.25, 'sine', 0.15);
        setTimeout(() => playBeep(659.25, 'sine', 0.15), 150);
        setTimeout(() => playBeep(783.99, 'sine', 0.3), 300);
      }
    }

    // タイマーの状態管理
    let timer = null;
    let isRunning = false;
    let phase = 'work'; // 'work' | 'rest' | 'idle' | 'finished'
    let currentSet = 1;
    let totalSets = 3;
    let timeRemaining = 30;

    // DOM要素の取得
    const timerDisplay = document.getElementById('timerDisplay');
    const statusBadge = document.getElementById('statusBadge');
    const setInfo = document.getElementById('setInfo');
    const workInput = document.getElementById('workInput');
    const restInput = document.getElementById('restInput');
    const setsInput = document.getElementById('setsInput');
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const clearBtn = document.getElementById('clearBtn');

    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = seconds % 60;
      return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    }

    function updateDisplay() {
      timerDisplay.textContent = formatTime(timeRemaining);
      setInfo.textContent = `残数: ${currentSet} / ${totalSets} セット`;

      statusBadge.className = 'status-badge';
      if (phase === 'work') {
        statusBadge.textContent = 'ストレッチ中';
        statusBadge.classList.add('status-work');
      } else if (phase === 'rest') {
        statusBadge.textContent = '休憩中';
        statusBadge.classList.add('status-rest');
      } else if (phase === 'finished') {
        statusBadge.textContent = '完了！';
      } else {
        statusBadge.textContent = '準備中';
      }
    }

    function tick() {
      if (timeRemaining > 0) {
        // 残り3秒、2秒、1秒のタイミングでピッと鳴らす
        if (timeRemaining <= 3) {
          soundNotice('countdown');
        }
        timeRemaining--;
        updateDisplay();
      } else {
        // フェーズ切り替え処理
        if (phase === 'work') {
          if (currentSet < totalSets) {
            phase = 'rest';
            timeRemaining = parseInt(restInput.value) || 30;
            soundNotice('change');
          } else {
            // 全セット終了
            phase = 'finished';
            stopTimer();
            soundNotice('complete');
          }
        } else if (phase === 'rest') {
          currentSet++;
          phase = 'work';
          timeRemaining = parseInt(workInput.value) || 30;
          soundNotice('change');
        }
        updateDisplay();
      }
    }

    function startTimer() {
      initAudio();
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }

      if (isRunning) return;

      // 停止からの再開でない場合は初期設定を読み込む
      if (phase === 'idle' || phase === 'finished') {
        totalSets = parseInt(setsInput.value) || 3;
        currentSet = 1;
        phase = 'work';
        timeRemaining = parseInt(workInput.value) || 30;
      }

      isRunning = true;
      startBtn.disabled = true;
      stopBtn.disabled = false;
      toggleInputs(true);

      updateDisplay();
      timer = setInterval(tick, 1000);
    }

    function stopTimer() {
      clearInterval(timer);
      timer = null;
      isRunning = false;
      startBtn.disabled = false;
      stopBtn.disabled = true;
    }

    function resetTimer() {
      stopTimer();
      phase = 'idle';
      timeRemaining = parseInt(workInput.value) || 30;
      totalSets = parseInt(setsInput.value) || 3;
      currentSet = 1;
      toggleInputs(false);
      updateDisplay();
    }

    function toggleInputs(disabled) {
      workInput.disabled = disabled;
      restInput.disabled = disabled;
      setsInput.disabled = disabled;
    }

    // イベントリスナー
    startBtn.addEventListener('click', startTimer);
    stopBtn.addEventListener('click', stopTimer);
    clearBtn.addEventListener('click', resetTimer);

    // 入力値変更時に初期表示を更新
    [workInput, restInput, setsInput].forEach(input => {
      input.addEventListener('change', () => {
        if (!isRunning && phase === 'idle') {
          timeRemaining = parseInt(workInput.value) || 30;
          totalSets = parseInt(setsInput.value) || 3;
          updateDisplay();
        }
      });
    });

    // 初期化表示
    resetTimer();
  </script>
</body>
</html>
